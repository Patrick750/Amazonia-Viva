name: Despliegue Automático Amazonia Viva

# Produccion despliega la referencia versionada de main. La rama MEJ-003 puede
# desplegarse directamente para validar los cambios antes de integrarlos.
on:
  push:
    branches:
      - codex/mej-003-estandar-paquetes
  workflow_run:
    workflows: ['Version Bump on Merge']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-amazonia-viva
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      deploy_branch: ${{ steps.release.outputs.branch }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amazonia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-placeholder-key-with-more-than-fifty-characters-for-tests
      DEBUG: 'true'
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/amazonia_test
      CHECKOUT_MODE: disabled
      ALLOW_WITHDRAWALS: 'false'
    steps:
      - name: Descargar referencia versionada de produccion
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: versioned-reference
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .versioned
      - name: Resolver referencia a desplegar
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSIONED_SHA="$PUSH_SHA"
            DEPLOY_BRANCH="$PUSH_BRANCH"
          else
            VERSIONED_SHA=$(cat .versioned/versioned-sha.txt)
            DEPLOY_BRANCH="main"
          fi

          [[ "$VERSIONED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          case "$DEPLOY_BRANCH" in
            main|codex/mej-003-estandar-paquetes) ;;
            *)
              echo "Rama de despliegue no autorizada: $DEPLOY_BRANCH"
              exit 1
              ;;
          esac

          printf 'sha=%s\n' "$VERSIONED_SHA" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/versionamiento.py check
      - run: python -m unittest discover -s tests -p 'test_versionamiento.py'
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test autenticacion --noinput
      - run: DEBUG=false python manage.py check --deploy --tag security --fail-level WARNING
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend_project/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend_project

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
    # 2. Clona tu código en el servidor de GitHub
    - name: Obtener el código
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.verify.outputs.release_sha }}

    # 3. Inicia sesión en Docker Hub
    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Construye y sube el Backend a Docker Hub
    - name: Build y Push Backend
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        file: ./amazoniaviva/Dockerfile
        tags: ${{ secrets.DOCKER_USERNAME }}/amazoniaviva_backend:latest

    # 5. Construye y sube el Frontend a Docker Hub
    - name: Build y Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend_project
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/amazoniaviva_frontend:latest

    # 6. Se conecta al VPS y actualiza los contenedores
    - name: Desplegar en el VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        # Estos son los comandos que GitHub ejecutará dentro de tu VPS:
        script: |
          set -euo pipefail
          cd ~/Amazonia-Viva
          DEPLOY_BRANCH="${{ needs.verify.outputs.deploy_branch }}"
          RELEASE_SHA="${{ needs.verify.outputs.release_sha }}"
          git fetch --prune origin "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          git checkout -f -B "$DEPLOY_BRANCH" "$RELEASE_SHA"
          git branch --set-upstream-to="origin/$DEPLOY_BRANCH" "$DEPLOY_BRANCH"
          docker compose pull
          docker compose up -d --build
          docker compose exec -T backend python manage.py check --deploy --tag security --fail-level WARNING
          docker compose exec -T backend python manage.py migrate --noinput
          docker image prune -f
