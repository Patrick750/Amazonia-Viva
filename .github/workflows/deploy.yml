name: Despliegue Automático Amazonia Viva

# El commit del bot usa GITHUB_TOKEN y no genera otro push workflow.
# Esperar al versionado y desplegar exactamente la referencia publicada.
on:
  workflow_run:
    workflows: ['Version Bump on Merge']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-main
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amazonia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-placeholder-key-with-more-than-fifty-characters-for-tests
      DEBUG: 'true'
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/amazonia_test
      CHECKOUT_MODE: disabled
      ALLOW_WITHDRAWALS: 'false'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versioned-reference
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .versioned
      - name: Validar referencia publicada
        id: release
        run: |
          VERSIONED_SHA=$(cat .versioned/versioned-sha.txt)
          [[ "$VERSIONED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'sha=%s\n' "$VERSIONED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/versionamiento.py check
      - run: python -m unittest discover -s tests -p 'test_versionamiento.py'
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test autenticacion --noinput
      - run: DEBUG=false python manage.py check --deploy --tag security --fail-level WARNING
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend_project/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend_project

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
    # 2. Clona tu código en el servidor de GitHub
    - name: Obtener el código
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.verify.outputs.release_sha }}

    # 3. Inicia sesión en Docker Hub
    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Construye y sube el Backend a Docker Hub
    - name: Build y Push Backend
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        file: ./amazoniaviva/Dockerfile
        tags: ${{ secrets.DOCKER_USERNAME }}/amazoniaviva_backend:latest

    # 5. Construye y sube el Frontend a Docker Hub
    - name: Build y Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend_project
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/amazoniaviva_frontend:latest

    # 6. Se conecta al VPS y actualiza los contenedores
    - name: Desplegar en el VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        # Estos son los comandos que GitHub ejecutará dentro de tu VPS:
        script: |
          # Asegúrate de que esta sea la ruta real en tu servidor VPS
          cd ~/Amazonia-Viva
          git fetch origin main
          git checkout --detach ${{ needs.verify.outputs.release_sha }}
          docker compose pull
          docker compose up -d --build
          docker compose exec -T backend python manage.py check --deploy --tag security --fail-level WARNING
          docker compose exec -T backend python manage.py migrate --noinput
          docker image prune -f